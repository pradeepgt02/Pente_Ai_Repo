[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=reports/report.html --self-contained-html
markers =
    e2e: End-to-end business workflow tests
    smoke: Quick sanity smoke tests
    crud: Knowledge Base CRUD tests
    chat: AI interaction tests
